[build-system]
requires = ["maturin[patchelf,zig]>=1.9.5,<2.0"]
build-backend = "maturin"

[project]
name = "tdigest-rs"                     # matches version("tdigest-rs") in __init__.py
dynamic = ["version"]
description = "Rust TDigest with Python (class API) and Polars expressions"
readme = "../../README.md"              # important: exists relative to bindings/python/
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ingolfur Edvardsson", email = "ingo.edvardsson@gresearch.co.uk" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

# Keep runtime deps minimal; Polars is optional (only needed for expr API).
dependencies = [
  "numpy>=2.0.0",
]

[project.optional-dependencies]
polars = ["polars>=1.34.0"]

# Dev groups (PEP 735). uv understands these and can install with --group/--all-groups.
[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "ruff>=0.13.3",
  "pre-commit>=4.3.0",
  "maturin[patchelf,zig]>=1.9.5",
  "numpy>=2.3.3",
  "mypy>=1.18.2",
  "polars>=1.34.0",  # dev/test convenience; not required by end users
]

[tool.maturin]
manifest-path = "../../Cargo.toml"     # your Rust crate at repo root
features = ["python"]
bindings = "pyo3-abi3"
module-name = "tdigest_rs.tdigest_rs"  # put the extension inside the package
python-source = "."
strip = true
manylinux = "2_28"
zig = true
include = ["tdigest_rs/**"]



# ------------------------------------------------------------
# Ruff
# ------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["target","dist","build",".venv",".maturin",".pytest_cache",".ruff_cache"]

# ------------------------------------------------------------
# Pytest
# ------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

# ------------------------------------------------------------
# Mypy
# ------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
exclude = "(^target/|^build/|^dist/|^\\.venv/|^out/)"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
